[package]
name = "muesli"
description = "Local, private meeting recorder and summariser for macOS"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[lib]
name = "muesli_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
muesli-llm = { path = "../crates/llm" }
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender = "0.2"
rusqlite = { version = "0.40", features = ["bundled", "serde_json"] }
rusqlite_migration = "2"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "http2"] }
futures-util = "0.3"
sha2 = "0.11"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
minijinja = { version = "3", features = ["loop_controls", "macros", "multi_template", "builtins", "json", "adjacent_loop_items", "serde"] }
