name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to the same pull request or branch cancels the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Checks appear as "validate / versions", "validate / frontend", "validate / rust-check"
  # and "validate / bundle" (the DMG is attached to the run as the `muesli-dmg` artifact).
  validate:
    uses: ./.github/workflows/validate.yml
