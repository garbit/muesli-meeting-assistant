name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - name: Cache Swift build
        uses: actions/cache@v4
        with:
          path: sidecar/.build
          key: swift-${{ runner.os }}-${{ hashFiles('sidecar/Package.swift', 'sidecar/Package.resolved') }}
      - run: pnpm install --frozen-lockfile
      # Only export the Apple signing variables when a certificate is configured;
      # empty variables make the bundler try to import an empty certificate.
      - name: Configure Developer ID signing
        if: env.HAS_APPLE_CERT == 'true'
        run: |
          {
            echo "APPLE_CERTIFICATE=${{ secrets.APPLE_CERTIFICATE }}"
            echo "APPLE_CERTIFICATE_PASSWORD=${{ secrets.APPLE_CERTIFICATE_PASSWORD }}"
            echo "APPLE_SIGNING_IDENTITY=${{ secrets.APPLE_SIGNING_IDENTITY }}"
            echo "APPLE_ID=${{ secrets.APPLE_ID }}"
            echo "APPLE_PASSWORD=${{ secrets.APPLE_PASSWORD }}"
            echo "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}"
          } >> "$GITHUB_ENV"
      - name: Ad-hoc signing
        if: env.HAS_APPLE_CERT != 'true'
        run: echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Muesli ${{ github.ref_name }}
          releaseBody: |
            On first launch, right-click Muesli.app and choose Open (the app is not notarised yet).
            After updating, macOS asks again for Microphone and System Audio Recording.
          releaseDraft: true
          prerelease: false
          # The sidecar is built by beforeBuildCommand; updater artifacts are only produced here.
          args: --target aarch64-apple-darwin --config '{"bundle":{"createUpdaterArtifacts":true}}'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
